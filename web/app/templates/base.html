<!DOCTYPE html>
<html lang="en" data-theme="{{ session.get('theme', 'light') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HYPPO{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.3" crossorigin="anonymous"></script>
    <style>
        /* Minimal reset and base styles */
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        nav a { margin-right: 1rem; text-decoration: none; }
        .flash-messages { padding: 0.5rem 1rem; }
        .flash { padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 4px; }
        .flash.error { background: #fee2e2; color: #b91c1c; }
        .flash.success { background: #d1fae5; color: #065f46; }
        main { padding: 1rem 2rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/">Log</a>
        <a href="/journal/{{ today }}">Journal</a>
        <a href="/habits">Habits</a>
        <a href="/settings">Settings</a>
        {% if current_user %}
            <a href="/logout">Logout</a>
        {% endif %}
    </nav>

    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
    </div>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
